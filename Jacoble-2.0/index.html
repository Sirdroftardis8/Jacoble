<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacoble</title>
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body>
    <!-- Container for custom toast popups -->
    <div id="toast-container"></div>

    <h1> Jacoble </h1>
    
    <!-- Share button starts hidden, will display when game ends -->
    <button id="share-btn" style="display: none;">Share Results 📋</button>

<!-- Identity Verification Bar -->
<div id="jacob-gate" style="text-align: center; margin: 15px auto; max-width: 400px; padding: 12px; background: #121213; border: 1px solid #3a3a3c; border-radius: 8px; color: #fff; font-family: sans-serif;">
  <div id="gate-inputs" style="display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;">
    <input id="gate-name" type="text" placeholder="First Name" style="padding: 8px 12px; border-radius: 4px; border: 1px solid #3a3a3c; background: #1e1e1f; color: #fff; width: 110px; font-size: 14px;">
    
    <!-- Passcode input (hidden by default) -->
    <input id="gate-secret" type="password" placeholder="Passcode" style="padding: 8px 12px; border-radius: 4px; border: 1px solid #3a3a3c; background: #1e1e1f; color: #fff; width: 110px; font-size: 14px; display: none;">
    
    <button id="gate-btn" type="button" style="padding: 8px 16px; background: #538d4e; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Verify</button>
  </div>
  <div id="gate-status" style="margin-top: 6px; font-size: 13px; color: #818384;">Please enter your name to begin</div>
</div>


    <div id="game-board">

    </div>

    <div id="keyboard-cont">
        <div class="first-row">
            <button class="keyboard-button">q</button>
            <button class="keyboard-button">w</button>
            <button class="keyboard-button">e</button>
            <button class="keyboard-button">r</button>
            <button class="keyboard-button">t</button>
            <button class="keyboard-button">y</button>
            <button class="keyboard-button">u</button>
            <button class="keyboard-button">i</button>
            <button class="keyboard-button">o</button>
            <button class="keyboard-button">p</button>
        </div>
        <div class="second-row">
            <button class="keyboard-button">a</button>
            <button class="keyboard-button">s</button>
            <button class="keyboard-button">d</button>
            <button class="keyboard-button">f</button>
            <button class="keyboard-button">g</button>
            <button class="keyboard-button">h</button>
            <button class="keyboard-button">j</button>
            <button class="keyboard-button">k</button>
            <button class="keyboard-button">l</button>
        </div>
        <div class="third-row">
            <button class="keyboard-button">Del</button>
            <button class="keyboard-button">z</button>
            <button class="keyboard-button">x</button>
            <button class="keyboard-button">c</button>
            <button class="keyboard-button">v</button>
            <button class="keyboard-button">b</button>
            <button class="keyboard-button">n</button>
            <button class="keyboard-button">m</button>
            <button class="keyboard-button">Enter</button>
        </div>
    </div>

<script src="script.js" type="module"></script>
</body>
</html>
